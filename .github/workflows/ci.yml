name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements.txt

      - name: Compile check
        run: python -m compileall -q cetapp main.py tools

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Check for accidental secrets
        shell: pwsh
        run: |
          $matches = Get-ChildItem -Recurse -File -Include *.py,*.json,*.md,*.txt,*.toml,*.yml,*.yaml |
            Select-String -Pattern 'sk-[A-Za-z0-9]{16,}'
          if ($matches) {
            $matches | ForEach-Object { Write-Host "::error file=$($_.Path),line=$($_.LineNumber)::Possible API key" }
            exit 1
          }
          Write-Host "No obvious API keys found."
